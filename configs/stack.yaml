version: "2.0.0"
architecture: "5-Tier Sovereign DAG (14 Repositories)"

repositories:
  tier0_fs:
    name: "sentinel-fs"
    url: "https://github.com/kamisaberi/sentinel-fs.git"
    branch: "main"
  tier0_xinfer:
    name: "xinfer-essential"
    url: "https://github.com/kamisaberi/xinfer-essential.git"
    branch: "main"
  tier0_blackbox:
    name: "blackbox-essential"
    url: "https://github.com/kamisaberi/blackbox-essential.git"
    branch: "main"
  tier1_sentinel:
    name: "blackbox-sentinel"
    url: "https://github.com/kamisaberi/blackbox-sentinel.git"
    branch: "main"
  tier1_forge:
    name: "xinfer-forge"
    url: "https://github.com/kamisaberi/xinfer-forge.git"
    branch: "main"
  tier2_ics:
    name: "ics-guard"
    url: "https://github.com/kamisaberi/ics-guard.git"
    branch: "main"
  tier2_ccsds:
    name: "ccsds-guard"
    url: "https://github.com/kamisaberi/ccsds-guard.git"
    branch: "main"
  tier2_net:
    name: "net-guard"
    url: "https://github.com/kamisaberi/net-guard.git"
    branch: "main"
  tier2_motion:
    name: "motion-guard"
    url: "https://github.com/kamisaberi/motion-guard.git"
    branch: "main"
  tier2_vision:
    name: "vision-guard"
    url: "https://github.com/kamisaberi/vision-guard.git"
    branch: "main"
  tier3_matrix:
    name: "sentinel-matrix"
    url: "https://github.com/kamisaberi/sentinel-matrix.git"
    branch: "main"
  tier3_lab:
    name: "sentinel-lab"
    url: "https://github.com/kamisaberi/sentinel-lab.git"
    branch: "main"
  tier4_nexus:
    name: "sentinel-nexus"
    url: "https://github.com/kamisaberi/sentinel-nexus.git"
    branch: "main"
  tier4_stack:
    name: "sentinel-stack"
    url: "https://github.com/kamisaberi/sentinel-stack.git"
    branch: "main"

paths:
  install_bin: "/usr/local/bin"
  install_lib: "/usr/local/lib"
  install_include: "/usr/local/include"
  packs_dir: "/opt/sentinel/packs"
  venv_dir: "/opt/sentinel-stack/venv"
  ssfs_system_root: "/var/lib/sentinel"
  ssfs_user_root: "${HOME}/.sentinel"
